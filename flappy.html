<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="UTF-8">
<title>Flappy Bird 🐦</title>

<style>
body {
    margin: 0;
    background: linear-gradient(#87ceeb, #ffcce6);
    overflow: hidden;
    text-align: center;
    font-family: Arial, sans-serif;
}

canvas {
    background: #87ceeb;
    display: block;
    margin: auto;
    border: 3px solid white;
}

h1 {
    color: white;
}
</style>
</head>
<body>

<h1>🐦 Flappy Bird 🐦</h1>
<canvas id="game" width="400" height="600"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let gameStarted = false;
let gameOver = false;

let bird = {
    x: 80,
    y: 250,
    gravity: 0.2,
    lift: -7,
    velocity: 0
};

let pipes = [];
let score = 0;

function drawBird() {
    ctx.font = "30px Arial";
    ctx.fillText("🐦", bird.x, bird.y);
}

function createPipe() {
    let gap = 180;
    let topHeight = Math.random() * 250 + 50;

    pipes.push({
        x: canvas.width,
        top: topHeight,
        bottom: topHeight + gap,
        width: 50
    });
}

function drawPipes() {
    ctx.fillStyle = "green";

    pipes.forEach(pipe => {
        ctx.fillRect(pipe.x, 0, pipe.width, pipe.top);
        ctx.fillRect(pipe.x, pipe.bottom, pipe.width, canvas.height);
    });
}

function updatePipes() {
    pipes.forEach(pipe => {
        pipe.x -= 2;
    });

    pipes = pipes.filter(pipe => pipe.x + pipe.width > 0);
}

function checkCollision() {
    for (let pipe of pipes) {
        if (
            bird.x + 20 > pipe.x &&
            bird.x < pipe.x + pipe.width &&
            (bird.y < pipe.top || bird.y > pipe.bottom)
        ) {
            endGame();
        }
    }

    if (bird.y > canvas.height || bird.y < 0) {
        endGame();
    }
}

function endGame() {
    gameOver = true;
    alert("Game Over! Score: " + score);
    document.location.reload();
}

function drawStartScreen() {
    ctx.fillStyle = "white";
    ctx.font = "30px Arial";
    ctx.fillText("Click to Start", 110, 300);
}

function update() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    drawBird();
    drawPipes();

    if (!gameStarted) {
        drawStartScreen();
        requestAnimationFrame(update);
        return;
    }

    if (!gameOver) {
        bird.velocity += bird.gravity;
        bird.y += bird.velocity;

        updatePipes();
        checkCollision();

        ctx.fillStyle = "white";
        ctx.font = "20px Arial";
        ctx.fillText("Score: " + score, 10, 30);
    }

    requestAnimationFrame(update);
}

document.addEventListener("click", () => {
    if (!gameStarted) {
        gameStarted = true;
        setInterval(createPipe, 2000);
        return;
    }

    bird.velocity = bird.lift;
});

update();
</script>

</body>
</html>
