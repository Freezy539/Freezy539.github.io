<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="UTF-8">
<title>Tic Tac Toe 💗</title>
<link rel="stylesheet" href="style.css">
<style>
#board {
    display:grid;
    grid-template-columns: repeat(3,100px);
    gap:10px;
    justify-content:center;
    margin-top:30px;
}
.cell {
    width:100px;
    height:100px;
    background:white;
    border-radius:15px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:40px;
    cursor:pointer;
}
</style>
<script>
let board = ["","","","","","","","",""];
let turn = "❌";

function makeMove(i, el){
    if(board[i]===""){
        board[i]=turn;
        el.textContent=turn;
        turn = turn==="❌"?"⭕":"❌";
    }
}
</script>
</head>
<body>
<h1>❌⭕ Tic Tac Toe</h1>
<div id="board">
<div class="cell" onclick="makeMove(0,this)"></div>
<div class="cell" onclick="makeMove(1,this)"></div>
<div class="cell" onclick="makeMove(2,this)"></div>
<div class="cell" onclick="makeMove(3,this)"></div>
<div class="cell" onclick="makeMove(4,this)"></div>
<div class="cell" onclick="makeMove(5,this)"></div>
<div class="cell" onclick="makeMove(6,this)"></div>
<div class="cell" onclick="makeMove(7,this)"></div>
<div class="cell" onclick="makeMove(8,this)"></div>
</div>
<br>
<a href="index.html">⬅ Tagasi</a>
</body>
</html>
