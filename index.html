<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Eesti äpp</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;
  -webkit-tap-highlight-color:transparent;
}

body{
  background:#020202;
  min-height:100vh;
  overflow-x:hidden;
  color:white;
}

/* taust */
body::before{
  content:"";
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at top,#242733 0%,transparent 45%),
    radial-gradient(circle at bottom,#002f9f33 0%,transparent 40%);
  opacity:.9;
  z-index:-2;
}

/* pattern */
body::after{
  content:"";
  position:fixed;
  inset:0;
  background-image:
    radial-gradient(rgba(255,255,255,.035) 1px, transparent 1px);
  background-size:22px 22px;
  opacity:.25;
  z-index:-1;
}

.app{
  max-width:430px;
  margin:auto;
  min-height:100vh;
  position:relative;
  padding:22px 22px 120px;
}

/* STATUS BAR */

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:10px;
  margin-bottom:30px;
}

.time{
  font-size:20px;
  font-weight:700;
  letter-spacing:-0.3px;
}

.status{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:14px;
}

.dynamic-island{
  position:absolute;
  top:0;
  left:50%;
  transform:translateX(-50%);
  width:160px;
  height:36px;
  border-radius:30px;
  background:black;
}

/* SEARCH */

.search{
  height:58px;
  border-radius:16px;
  background:rgba(0,0,0,.82);
  border:2px solid rgba(255,255,255,.75);
  display:flex;
  align-items:center;
  padding:0 18px;
  margin-bottom:34px;
}

.search input{
  width:100%;
  background:transparent;
  border:none;
  outline:none;
  color:white;
  font-size:18px;
  font-weight:600;
}

.search input::placeholder{
  color:#a4a4a4;
}

.search i{
  font-size:21px;
}

/* TITLE */

h1{
  font-size:66px;
  line-height:1;
  margin-bottom:34px;
  letter-spacing:-2px;
  font-weight:800;
}

/* STACK */

.stack-wrap{
  position:relative;
  height:560px;
  background:rgba(0,0,0,.72);
  border-radius:38px;
  overflow:hidden;
  padding-top:28px;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.03),
    0 30px 60px rgba(0,0,0,.55);
}

.stack-card{
  position:absolute;
  left:30px;
  right:30px;
  height:220px;
  border-radius:34px;
  overflow:hidden;
  padding:34px;
  box-shadow:0 18px 45px rgba(0,0,0,.45);
}

.stack-card::before{
  content:"";
  position:absolute;
  width:150%;
  height:110px;
  background:rgba(255,255,255,.22);
  transform:rotate(-8deg);
  left:-60px;
  top:92px;
}

.card-content{
  position:relative;
  z-index:2;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  height:100%;
}

.card-title{
  font-size:30px;
  font-weight:800;
  letter-spacing:-0.8px;
}

.license{
  top:34px;
  z-index:1;
  background:linear-gradient(135deg,#ffb6a0,#ff958b);
  color:#0041b5;
}

.passport{
  top:160px;
  z-index:2;
  background:linear-gradient(135deg,#8f0039,#cf0d58);
}

.idcard{
  top:290px;
  z-index:3;
  background:linear-gradient(135deg,#e8e8ea,#cfcfd3);
  color:#2b54b8;
}

/* FLAGS */

.flag{
  width:58px;
  height:38px;
  border-radius:9px;
  overflow:hidden;
  box-shadow:0 4px 12px rgba(0,0,0,.2);
}

.estonia div:nth-child(1){
  background:#1971ff;
  height:33%;
}

.estonia div:nth-child(2){
  background:black;
  height:33%;
}

.estonia div:nth-child(3){
  background:white;
  height:34%;
}

.eu{
  background:#0046cc;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#ffdb00;
  font-size:11px;
}

/* PASS ICON */

.pass-icon{
  width:58px;
  height:38px;
  border-radius:8px;
  background:#f6f2ef;
  position:relative;
}

.pass-icon::before{
  content:"";
  position:absolute;
  width:18px;
  height:18px;
  border:4px solid #b10048;
  border-radius:50%;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
}

.pass-icon::after{
  content:"";
  position:absolute;
  width:100%;
  height:4px;
  background:#b10048;
  top:50%;
  left:0;
  transform:translateY(-50%);
}

/* SCAN */

.scan{
  margin-top:34px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:14px;
  font-size:22px;
  font-weight:700;
  color:#ececec;
}

.scan i{
  font-size:28px;
}

/* NAVBAR */

.navbar{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:118px;
  background:rgba(0,0,0,.94);
  border-top:1px solid rgba(255,255,255,.08);
  display:flex;
  justify-content:space-around;
  align-items:flex-start;
  padding-top:18px;
  z-index:999;
}

.nav-item{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:8px;
  color:white;
  opacity:.95;
  font-size:13px;
  font-weight:700;
}

.nav-item i{
  font-size:28px;
}

.home-active{
  transform:translateY(-34px);
}

.home-circle{
  width:92px;
  height:92px;
  border-radius:50%;
  background:linear-gradient(180deg,#2164ff,#1452ea);
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:
    0 0 35px rgba(33,100,255,.55),
    inset 0 1px 2px rgba(255,255,255,.3);
  margin-bottom:10px;
}

.home-circle img{
  width:40px;
}

.home-label{
  margin-top:-2px;
}

.small-avatar{
  width:44px;
  height:44px;
  border-radius:50%;
  background:#003f9b;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  font-weight:800;
}

.bottom-indicator{
  position:fixed;
  bottom:8px;
  left:50%;
  transform:translateX(-50%);
  width:145px;
  height:5px;
  border-radius:20px;
  background:white;
  opacity:.9;
}

</style>
</head>
<body>


<div class="app">


  <!-- SEARCH -->
  <div class="search">
    <input type="text" placeholder="Otsin">
    <i class="fa-solid fa-magnifying-glass"></i>
  </div>

  <!-- TITLE -->
  <h1>Dokumendid</h1>

  <!-- CARD STACK -->
  <div class="stack-wrap">

    <!-- JUHILUBA -->
    <div class="stack-card license">

      <div class="card-content">

        <div class="card-title">
          Juhiluba
        </div>

        <div class="flag eu">
          ★ ★ ★
        </div>

      </div>

    </div>

    <!-- PASS -->
    <div class="stack-card passport">

      <div class="card-content">

        <div class="card-title" style="color:white;">
          Pass
        </div>

        <div class="pass-icon"></div>

      </div>

    </div>

    <!-- ID -->
    <div class="stack-card idcard">

      <div class="card-content">

        <div class="card-title">
          ID-kaart
        </div>

        <div class="flag estonia">
          <div></div>
          <div></div>
          <div></div>
        </div>

      </div>

    </div>

  </div>

  <!-- SCAN -->
  <div class="scan">
    <i class="fa-solid fa-qrcode"></i>
    <span>Skanneeri dokumenti</span>
  </div>

</div>

<!-- NAVBAR -->

<div class="navbar">

  <div class="nav-item">
    <div class="small-avatar">KT</div>
    <span>Rollid</span>
  </div>

  <div class="nav-item">
    <i class="fa-solid fa-table-cells-large"></i>
    <span>Teenused</span>
  </div>

  <div class="nav-item home-active">

    <div class="home-circle">
      <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/5/5f/Coat_of_arms_of_Estonia.svg/512px-Coat_of_arms_of_Estonia.svg.png">
    </div>

    <span class="home-label">Töölaud</span>

  </div>

  <div class="nav-item">
    <i class="fa-regular fa-envelope"></i>
    <span>Postkast</span>
  </div>

  <div class="nav-item">
    <i class="fa-solid fa-gear"></i>
    <span>Seaded</span>
  </div>

</div>

<div class="bottom-indicator"></div>

</body>
</html>
