<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Eesti äpp</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #0d0d0d;
      color: white;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .background-glow {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at top, rgba(70,70,90,0.35), transparent 40%),
        radial-gradient(circle at bottom, rgba(0,90,255,0.12), transparent 30%);
      pointer-events: none;
      z-index: 0;
    }

    .app {
      position: relative;
      z-index: 1;
      max-width: 430px;
      margin: auto;
      min-height: 100vh;
      padding: 22px;
      padding-bottom: 120px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
      margin-bottom: 24px;
    }

    .time {
      font-weight: 700;
      font-size: 18px;
    }

    .status-icons {
      display: flex;
      gap: 8px;
      font-size: 14px;
      opacity: 0.9;
    }

    .search {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      height: 46px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      padding: 0 16px;
      margin-bottom: 28px;
      backdrop-filter: blur(12px);
    }

    .search input {
      background: transparent;
      border: none;
      outline: none;
      color: white;
      width: 100%;
      font-size: 15px;
      margin-left: 10px;
    }

    .search input::placeholder {
      color: rgba(255,255,255,0.55);
    }

    h1 {
      font-size: 48px;
      margin-bottom: 26px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .cards {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .card {
      position: relative;
      border-radius: 30px;
      height: 190px;
      overflow: hidden;
      cursor: pointer;
      transition: 0.25s ease;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }

    .card:hover {
      transform: translateY(-3px) scale(1.01);
    }

    .card::before {
      content: "";
      position: absolute;
      width: 150%;
      height: 100px;
      background: rgba(255,255,255,0.15);
      transform: rotate(-8deg);
      top: 60px;
      left: -40px;
    }

    .card-content {
      position: relative;
      z-index: 2;
      height: 100%;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card-title {
      font-size: 28px;
      font-weight: 700;
    }

    .flag {
      width: 42px;
      height: 28px;
      border-radius: 7px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.15);
      align-self: flex-end;
    }

    .flag div:nth-child(1) {
      background: #3a7bff;
      height: 33%;
    }

    .flag div:nth-child(2) {
      background: black;
      height: 33%;
    }

    .flag div:nth-child(3) {
      background: white;
      height: 34%;
    }

    .id-card {
      background: linear-gradient(135deg, #f7f7f7, #dbdbdb);
      color: #111;
    }

    .passport-card {
      background: linear-gradient(135deg, #c2185b, #ff4f87);
    }

    .license-card {
      background: linear-gradient(135deg, #ffb08a, #ff7b92);
      color: #232323;
    }

    .screen {
      display: none;
      animation: fade 0.25s ease;
    }

    .screen.active {
      display: block;
    }

    @keyframes fade {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0px);
      }
    }

    .back {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 18px;
      margin-bottom: 26px;
      cursor: pointer;
      width: fit-content;
    }

    .detail-card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 30px;
      padding: 24px;
      backdrop-filter: blur(15px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    .doc-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 24px;
    }

    .doc-title {
      font-size: 26px;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .doc-subtitle {
      opacity: 0.6;
      font-size: 14px;
    }

    .photo-box {
      width: 100px;
      height: 120px;
      border-radius: 20px;
      background: rgba(255,255,255,0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 10px;
      font-size: 14px;
      opacity: 0.8;
    }

    .valid {
      background: rgba(111, 255, 0, 0.08);
      border: 1px solid rgba(111, 255, 0, 0.3);
      color: #b7ff7f;
      border-radius: 14px;
      padding: 14px;
      text-align: center;
      margin-bottom: 24px;
      font-weight: 600;
    }

    .barcode {
      height: 90px;
      background: #fff;
      border-radius: 18px;
      margin-bottom: 24px;
      position: relative;
      overflow: hidden;
    }

    .barcode::before {
      content: "";
      position: absolute;
      inset: 18px;
      background: repeating-linear-gradient(
        to right,
        black 0px,
        black 3px,
        transparent 3px,
        transparent 6px
      );
    }

    .field {
      padding: 18px 0;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      display: flex;
      justify-content: space-between;
      gap: 20px;
    }

    .field-label {
      opacity: 0.6;
      font-weight: 600;
    }

    .field-value {
      font-weight: 700;
      text-align: right;
    }

    .face-btn {
      margin-top: 30px;
      width: 100%;
      height: 58px;
      border: none;
      border-radius: 18px;
      font-size: 17px;
      font-weight: 700;
      background: linear-gradient(135deg, #ffffff, #e6e6e6);
      cursor: pointer;
    }

    .navbar {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: 18px;
      width: calc(100% - 30px);
      max-width: 400px;
      background: rgba(18,18,18,0.82);
      border: 1px solid rgba(255,255,255,0.06);
      backdrop-filter: blur(25px);
      border-radius: 28px;
      display: flex;
      justify-content: space-around;
      padding: 16px 10px;
      z-index: 999;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      opacity: 0.6;
    }

    .nav-item.active {
      opacity: 1;
      color: #6ba8ff;
    }
  </style>
</head>
<body>

<div class="background-glow"></div>

<div class="app">

  <div id="homeScreen" class="screen active">

    <div class="topbar">
      <div class="time">13:14</div>

      <div class="status-icons">
        <i class="fa-solid fa-signal"></i>
        <i class="fa-solid fa-wifi"></i>
        <i class="fa-solid fa-battery-three-quarters"></i>
      </div>
    </div>

    <div class="search">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" placeholder="Otsin" />
    </div>

    <h1>Dokumendid</h1>

    <div class="cards">

      <div class="card license-card" onclick="openDocument('Juhiluba')">
        <div class="card-content">
          <div class="flag">
            <div></div>
            <div></div>
            <div></div>
          </div>

          <div class="card-title">Juhiluba</div>
        </div>
      </div>

      <div class="card passport-card" onclick="openDocument('Pass')">
        <div class="card-content">
          <div class="flag">
            <div></div>
            <div></div>
            <div></div>
          </div>

          <div class="card-title">Pass</div>
        </div>
      </div>

      <div class="card id-card" onclick="openDocument('ID-kaart')">
        <div class="card-content">
          <div class="flag">
            <div></div>
            <div></div>
            <div></div>
          </div>

          <div class="card-title">ID-kaart</div>
        </div>
      </div>

    </div>
  </div>


  <div id="detailScreen" class="screen">

    <div class="back" onclick="goBack()">
      <i class="fa-solid fa-chevron-left"></i>
      <span>Dokumendid</span>
    </div>

    <div class="detail-card">

      <div class="doc-header">

        <div>
          <div class="doc-title" id="documentTitle">ID-kaart</div>
          <div class="doc-subtitle">Republic of Estonia</div>
        </div>

        <div class="photo-box">
          <i class="fa-regular fa-user" style="font-size:32px"></i>
          <span>Avan foto</span>
        </div>
      </div>

      <div class="valid">
        ✓ Kehtiv
      </div>

      <div class="barcode"></div>

      <div class="field">
        <div class="field-label">PEREKONNANIMI</div>
        <div class="field-value">TAEVERE</div>
      </div>

      <div class="field">
        <div class="field-label">EESNIMI</div>
        <div class="field-value">KETHON</div>
      </div>

      <div class="field">
        <div class="field-label">ISIKUKOOD</div>
        <div class="field-value">51002282710</div>
      </div>

      <div class="field">
        <div class="field-label">SÜNNIAEG</div>
        <div class="field-value">28.02.2010</div>
      </div>

      <div class="field">
        <div class="field-label">KEHTIB KUNI</div>
        <div class="field-value">26.03.2031</div>
      </div>

      <button class="face-btn">
        Kuva isikutuvastuse kood
      </button>

    </div>

  </div>

</div>

<div class="navbar">
  <div class="nav-item">
    <i class="fa-regular fa-id-card"></i>
    <span>Rollid</span>
  </div>

  <div class="nav-item">
    <i class="fa-solid fa-grid-2"></i>
    <span>Teenused</span>
  </div>

  <div class="nav-item active">
    <i class="fa-solid fa-wallet"></i>
    <span>Töölaud</span>
  </div>

  <div class="nav-item">
    <i class="fa-regular fa-envelope"></i>
    <span>Postkast</span>
  </div>

  <div class="nav-item">
    <i class="fa-solid fa-gear"></i>
    <span>Seaded</span>
  </div>
</div>

<script>

  const homeScreen = document.getElementById('homeScreen');
  const detailScreen = document.getElementById('detailScreen');
  const documentTitle = document.getElementById('documentTitle');

  function openDocument(title) {
    documentTitle.innerText = title;

    homeScreen.classList.remove('active');
    detailScreen.classList.add('active');

    window.scrollTo(0, 0);
  }

  function goBack() {
    detailScreen.classList.remove('active');
    homeScreen.classList.add('active');
  }

</script>

</body>
</html>
